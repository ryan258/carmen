name: Deploy GitHub Pages

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/pages.yml'
      - 'index.html'
      - 'carmen-sandiego-bentonville.html'
      - 'game.js'
      - 'game-core.js'
      - 'case-design.js'
      - 'game-experience.js'
      - 'quiz-activities.js'
      - 'game-activities.js'
      - 'quiz-practice.js'
      - 'study-core.js'
      - 'game-study.js'
      - 'game-session.js'
      - 'game-warrant.js'
      - 'game-map.js'
      - 'game-records.js'
      - 'run-generator.js'
      - 'map-config.js'
      - 'builtin-pack.js'
      - 'styles.css'
      - 'tailwind.build.css'
      - 'data/quiz-packs.json'
      - 'data/packs/*.json'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: github-pages
  cancel-in-progress: false

jobs:
  deploy:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Check out the published revision
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false

      - name: Configure Pages
        uses: actions/configure-pages@983d7736d9b0ae728b81ab479565c72886d7745b # v5

      - name: Package the checked-in game
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p _site/data/packs
          cp index.html carmen-sandiego-bentonville.html \
            game.js game-core.js case-design.js game-experience.js quiz-activities.js game-activities.js game-map.js game-records.js \
            quiz-practice.js study-core.js game-study.js game-session.js game-warrant.js \
            run-generator.js map-config.js builtin-pack.js \
            styles.css tailwind.build.css _site/
          cp data/quiz-packs.json _site/data/
          cp data/packs/*.json _site/data/packs/
          touch _site/.nojekyll
          printf '{"commit":"%s"}\n' "$GITHUB_SHA" > _site/version.json

      - name: Upload the site
        uses: actions/upload-pages-artifact@7b1f4a764d45c48632c6b24a0339c27f5614fb0b # v4
        with:
          path: _site

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4
